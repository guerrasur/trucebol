name: Plan Condor branch check
on:
  push:
    branches: [plan-condor-partidos]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/engine.js
      - run: node --check src/app.js
      - run: npm test
